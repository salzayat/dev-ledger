name: Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Install dependencies
        run: npm ci
      - name: Refuse undeclared work
        # Every pull request passes through here, so the declared-work gate lives with the rest of the gate.
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./scripts/check-declared.sh "origin/${{ github.base_ref }}" HEAD
      - name: Run repository quality gate
        env:
          CHECK_DIFF_RANGE: ${{ format('{0}...{1}', github.event.pull_request.base.sha || github.event.before, github.sha) }}
          CHECK_DEPENDABOT: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: npm run check
      - name: Run rename fixture
        run: ./scripts/test-rename.sh
      - name: Check dependency advisories
        run: ./scripts/check-dependency-advisories.sh
