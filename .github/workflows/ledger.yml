name: Ledger

on:
  pull_request:
    # A page is a function of commits, records, and the code that reads them. Prose alone cannot move it, so
    # a pull request that changes only prose does not build one; every push to main still does.
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - 'openspec/**'
      - '.agent/**'
      - '**/*.md'
  push:
    branches: [main]

# The build is cheap and idempotent, so a superseded pull request run is cancelled. Deployments are not:
# they are serialized by their own group below so two merges cannot race the single Pages site.
concurrency:
  group: board-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.rebuild.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The projection is rebuilt from commit history, pull head refs, and tags, so a shallow checkout
          # would build a different projection than an operator's.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore the mirror
        # The bare mirror carries over between runs, so sync is an incremental fetch of the refs that moved.
        # The projection is a function of the ref tips, so a warm mirror cannot produce a different page.
        uses: actions/cache@v4
        with:
          path: .telemetry/mirrors
          key: ledger-mirror-${{ github.sha }}
          restore-keys: |
            ledger-mirror-
      - name: Restore the last deployed hash
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: .telemetry/deployed.sha256
          key: ledger-deployed-${{ github.sha }}
          restore-keys: |
            ledger-deployed-
      - name: Sync this repository over HTTPS
        # The registry records an SSH URL for an operator's own git access. Continuous integration has no
        # key and needs none: it fetches the same public repository over HTTPS with the token the platform
        # issues to this run, overriding the URL for this one entry without touching registry.json.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/telemetry.sh sync \
            --entry dev-ledger \
            --fetch-url "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: Rebuild the projection
        id: rebuild
        # A deploy is skipped when the projection's bytes are the ones already published.
        run: |
          hash=$(./scripts/telemetry.sh rebuild | sed -n 's/^sha256 //p')
          previous=$(cat .telemetry/deployed.sha256 2>/dev/null || true)
          if [ "$hash" = "$previous" ]; then
            printf '%s\n' "changed=false" >>"$GITHUB_OUTPUT"
            printf '%s\n' "projection $hash is already deployed"
          else
            printf '%s\n' "changed=true" >>"$GITHUB_OUTPUT"
            printf '%s\n' "$hash" >.telemetry/deployed.sha256
          fi
      - name: Render The Ledger
        run: |
          mkdir -p site
          ./scripts/telemetry.sh ledger --html site/index.html
      - name: Write the terminal render into the run summary
        run: |
          {
            printf '## The Ledger\n\n'
            printf '```\n'
            ./scripts/telemetry.sh ledger
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload the page
        uses: actions/upload-artifact@v5
        with:
          name: board
          path: site/index.html
          if-no-files-found: error
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == false && steps.rebuild.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    # Never from a pull request, and never while the repository is private: a Pages site is public on every
    # plan that offers one for a private repository, so the gate lives here rather than in someone's memory.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == false && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: board-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
